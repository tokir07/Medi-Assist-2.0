# Render Infrastructure as Code Blueprint for MediAssist 2.0
# Deploys Managed PostgreSQL Database, FastAPI Backend, and Vite React Frontend

services:
  # --------------------------------------------------
  # 1. FastAPI Python Web Service (Backend)
  # --------------------------------------------------
  - type: web
    name: mediassist-backend
    runtime: python
    region: singapore
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mediassist-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: AI_PROVIDER
        value: "openrouter"
      - key: OPENROUTER_API_KEY
        sync: false  # User provides secret in Render Dashboard
      - key: OPENROUTER_BASE_URL
        value: "https://openrouter.ai/api/v1"
      - key: OPENROUTER_MODEL
        value: "openai/gpt-4o-mini"
      - key: OPENROUTER_HTTP_REFERER
        value: "https://mediassist.app"
      - key: OPENROUTER_APP_NAME
        value: "MediAssist"
      - key: STT_PROVIDER
        value: "mock"
      - key: TTS_PROVIDER
        value: "mock"
      - key: AI_TIMEOUT_SECONDS
        value: "30"
      - key: AI_MAX_RETRIES
        value: "2"
      - key: CORS_ORIGINS
        value: '["*"]'

  # --------------------------------------------------
  # 2. Vite + React Static Site (Frontend)
  # --------------------------------------------------
  - type: web
    name: mediassist-frontend
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: mediassist-backend
          property: host

databases:
  # --------------------------------------------------
  # 3. Managed PostgreSQL Database
  # --------------------------------------------------
  - name: mediassist-db
    databaseName: mediassist
    user: mediassist
    region: singapore
    plan: free
